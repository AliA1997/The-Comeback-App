kind = "mobile"
previewPath = "/"
title = "Career Comeback Time Tracker"
version = "1.0.0"
id = "artifacts/career-tracker"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 24577

[services.development]
run = "pnpm --filter @workspace/career-tracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/career-tracker", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/career-tracker", "run", "serve" ]

[services.env]
PORT = "24577"
BASE_PATH = "/"
